<!doctype html><meta charset="utf-8"><title>FlareWise video capture</title>
<style>body{margin:0;background:#101a22;color:#e9eff2;font:14px system-ui}header{height:48px;display:flex;align-items:center;gap:20px;padding:0 20px}button,a{padding:8px 14px;background:#c9e5d1;color:#10241a;border:0;border-radius:6px}iframe{width:100vw;height:calc(100vh - 48px);border:0}a{display:none}</style>
<header><b>FlareWise · recording utility</b><button id="record">Record 50-second scene</button><span id="status">Open Simulation workbench and play Transport, then record.</span><a id="download" download="flarewise-scene.webm">Download scene video</a></header><iframe id="app" src="/"></iframe>
<script>
const b=document.querySelector('#record'),status=document.querySelector('#status'),a=document.querySelector('#download');
b.onclick=()=>{const canvas=document.querySelector('#app').contentDocument.querySelector('.transport-canvas canvas');if(!canvas){status.textContent='Open Transport first.';return}b.disabled=true;const stream=canvas.captureStream(30),chunks=[];const type=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));const r=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:8000000});r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};r.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type});a.href=URL.createObjectURL(blob);a.style.display='inline';status.textContent='Recording complete: '+(blob.size/1048576).toFixed(1)+' MB';b.disabled=false};r.start();let left=50;status.textContent='Recording: 50 seconds remaining';const timer=setInterval(()=>{left--;status.textContent='Recording: '+left+' seconds remaining';if(left<=0){clearInterval(timer);r.stop()}},1000)};
</script>
